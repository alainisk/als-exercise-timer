<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Al's Timer">
  <meta name="theme-color" content="#1B2138">
  <title>Al's Exercise Timer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">

    <!-- ========== HOME SCREEN (Workout List) ========== -->
    <div id="screen-home" class="screen active">
      <div class="home-header">
        <h1 class="home-title">Al's Exercise<br>Timer</h1>
      </div>
      <div class="home-body">
        <div id="workout-list" class="workout-list"></div>
        <button id="btn-add-workout-home" class="btn-add-workout">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          <span>New Workout</span>
        </button>
      </div>
      <div class="home-footer">
        <button id="btn-settings" class="fab-btn" aria-label="Settings">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.61 3.61 0 0112 15.6z"/></svg>
        </button>
      </div>
    </div>

    <!-- ========== WORKOUT START SCREEN ========== -->
    <div id="screen-workout-start" class="screen">
      <div class="start-top">
        <button id="btn-start-back" class="nav-btn" aria-label="Back">
          <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <div class="start-image-area">
          <img id="start-workout-image" alt="" class="start-image hidden">
          <div id="start-image-placeholder" class="start-image-placeholder">
            <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
          </div>
        </div>
      </div>
      <div class="start-bottom">
        <h1 id="start-workout-name" class="start-workout-name">Classic Tabata</h1>
        <p id="start-workout-detail" class="start-workout-detail">8 sets &middot; 1 cycle &middot; ~04:07</p>
        <p id="start-last-workout" class="start-last-date">Last Workout: Never</p>

        <button id="btn-start-play" class="play-btn" aria-label="Start workout">
          <svg viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
        </button>

        <div class="start-actions">
          <button id="btn-start-settings" class="fab-btn fab-btn-sm" aria-label="Settings">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.61 3.61 0 0112 15.6z"/></svg>
          </button>
        </div>

        <button id="btn-return-home" class="btn-return-home">Return Home</button>
      </div>
    </div>

    <!-- ========== TIMER SCREEN ========== -->
    <div id="screen-timer" class="screen">
      <div class="timer-top">
        <button id="btn-timer-back" class="nav-btn" aria-label="Back">
          <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <div class="timer-image-area">
          <img id="timer-exercise-image" alt="" class="timer-image hidden">
          <video id="timer-exercise-video" muted playsinline loop class="timer-image hidden"></video>
          <div id="timer-image-placeholder" class="timer-image-placeholder">
            <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
          </div>
        </div>
      </div>
      <div class="timer-bottom">
        <div class="timer-phase-label" id="timer-phase-label">EXERCISE</div>
        <div class="timer-exercise-name" id="timer-exercise-name">Push-ups</div>
        <div class="timer-countdown" id="timer-countdown">00:20</div>
        <div class="timer-stats">
          <div class="timer-stat">
            <span class="stat-current" id="stat-set">01</span><span class="stat-total" id="stat-set-total">/08</span>
            <span class="stat-label">SETS</span>
          </div>
          <div class="timer-stat">
            <span class="stat-current" id="stat-cycle">01</span><span class="stat-total" id="stat-cycle-total">/01</span>
            <span class="stat-label">CYCLES</span>
          </div>
          <div class="timer-stat">
            <span class="stat-value" id="stat-time">00:29</span>
            <span class="stat-label">TIME</span>
          </div>
        </div>
        <div class="timer-controls">
          <button id="btn-pause" class="ctrl-btn" aria-label="Pause">
            <svg viewBox="0 0 24 24" id="pause-icon"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
            <svg viewBox="0 0 24 24" id="play-icon" class="hidden"><polygon points="6,3 20,12 6,21"/></svg>
          </button>
          <button id="btn-prev" class="ctrl-btn" aria-label="Previous">
            <svg viewBox="0 0 24 24"><polygon points="18,3 8,12 18,21"/><rect x="4" y="3" width="3" height="18"/></svg>
          </button>
          <button id="btn-next" class="ctrl-btn" aria-label="Next">
            <svg viewBox="0 0 24 24"><polygon points="6,3 16,12 6,21"/><rect x="17" y="3" width="3" height="18"/></svg>
          </button>
          <button id="btn-timer-reset" class="ctrl-btn" aria-label="Reset">
            <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- ========== COMPLETE SCREEN ========== -->
    <div id="screen-complete" class="screen">
      <div class="complete-content">
        <div class="complete-icon">
          <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
        </div>
        <h1>Workout Complete!</h1>
        <div class="complete-stats">
          <div class="complete-stat"><span id="complete-time">00:00</span><label>Total Time</label></div>
          <div class="complete-stat"><span id="complete-sets">0</span><label>Sets</label></div>
          <div class="complete-stat"><span id="complete-cycles">0</span><label>Cycles</label></div>
        </div>
        <button id="btn-complete-home" class="btn-primary">Back to Home</button>
      </div>
    </div>

    <!-- ========== SETTINGS SCREEN ========== -->
    <div id="screen-settings" class="screen">
      <div class="screen-header">
        <button id="btn-settings-back" class="nav-btn" aria-label="Back">
          <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <h2>Settings</h2>
        <div class="spacer"></div>
      </div>
      <div class="settings-body">
        <!-- Sounds -->
        <div class="settings-section">
          <h3>Sounds</h3>
          <div class="settings-row">
            <label for="snd-mute">Mute All</label>
            <input type="checkbox" id="snd-mute" class="toggle">
          </div>
          <div class="settings-row">
            <label for="snd-vibration">Vibration</label>
            <input type="checkbox" id="snd-vibration" class="toggle" checked>
          </div>
          <div class="settings-row">
            <label for="snd-interval">Interval Beep</label>
            <select id="snd-interval">
              <option value="short-beep">Short Beep</option>
              <option value="double-beep">Double Beep</option>
              <option value="whistle">Whistle</option>
              <option value="bell">Bell</option>
              <option value="off">Off</option>
            </select>
          </div>
          <div class="settings-row">
            <label for="snd-continuous">Continuous Beep</label>
            <select id="snd-continuous">
              <option value="off">Off</option>
              <option value="short-beep">Short Beep</option>
              <option value="rapid">Rapid</option>
            </select>
          </div>
          <div class="settings-row">
            <label for="snd-three-second">Three Second Beep</label>
            <select id="snd-three-second">
              <option value="short-beep" selected>Short Beep</option>
              <option value="double-beep">Double Beep</option>
              <option value="whistle">Whistle</option>
              <option value="off">Off</option>
            </select>
          </div>
          <div class="settings-row">
            <label for="snd-halfway">Halfway Beep</label>
            <select id="snd-halfway">
              <option value="double-beep" selected>Double Beep</option>
              <option value="short-beep">Short Beep</option>
              <option value="whistle">Whistle</option>
              <option value="off">Off</option>
            </select>
          </div>
        </div>
        <!-- Voice -->
        <div class="settings-section">
          <h3>Voice Assist</h3>
          <div class="settings-row">
            <label for="voice-enabled">Enable Voice</label>
            <input type="checkbox" id="voice-enabled" class="toggle" checked>
          </div>
          <div class="settings-row">
            <label for="voice-announce">Announce</label>
            <select id="voice-announce">
              <option value="all" selected>Intervals & Exercises</option>
              <option value="intervals">Intervals Only</option>
              <option value="exercises">Exercises Only</option>
            </select>
          </div>
        </div>
        <!-- Display -->
        <div class="settings-section">
          <h3>Display</h3>
          <div class="settings-row">
            <label for="theme-toggle">Light Theme</label>
            <input type="checkbox" id="theme-toggle" class="toggle">
          </div>
        </div>
        <!-- Data -->
        <div class="settings-section">
          <h3>Sync & Data</h3>
          <div class="settings-row">
            <button id="btn-export" class="btn-secondary">Export All Workouts</button>
          </div>
          <div class="settings-row">
            <button id="btn-import" class="btn-secondary">Import Workouts</button>
            <input type="file" id="import-file" accept=".json" class="hidden">
          </div>
        </div>
      </div>
    </div>

    <!-- ========== WORKOUT EDITOR SCREEN ========== -->
    <div id="screen-editor" class="screen">
      <div class="screen-header">
        <button id="btn-editor-back" class="nav-btn" aria-label="Back">
          <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <h2 id="editor-title">Edit Workout</h2>
        <button id="btn-editor-save" class="nav-btn save-btn" aria-label="Save">
          <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
        </button>
      </div>
      <div class="editor-body">
        <div class="editor-section">
          <label class="editor-label">Workout Name</label>
          <input type="text" id="edit-name" class="editor-input" placeholder="My Workout">
        </div>
        <div class="editor-section">
          <label class="editor-label">Workout Image</label>
          <div class="workout-image-upload">
            <img id="edit-workout-image-preview" class="workout-image-preview hidden" alt="Preview">
            <div class="workout-image-upload-btns">
              <button id="btn-workout-image" class="btn-secondary">Choose Image</button>
              <button id="btn-workout-image-clear" class="btn-danger btn-small hidden">Remove</button>
            </div>
            <input type="file" id="workout-image-input" accept="image/*" class="hidden">
          </div>
        </div>
        <div class="editor-section">
          <h3>Timing</h3>
          <div class="editor-row">
            <label>Initial Countdown</label>
            <div class="number-input">
              <button class="num-btn minus" data-target="edit-countdown">−</button>
              <input type="number" id="edit-countdown" value="7" min="0" max="30"> <span class="unit">s</span>
              <button class="num-btn plus" data-target="edit-countdown">+</button>
            </div>
          </div>
          <div class="editor-row">
            <label>Warmup</label>
            <div class="number-input">
              <button class="num-btn minus" data-target="edit-warmup">−</button>
              <input type="number" id="edit-warmup" value="0" min="0" max="600"> <span class="unit">s</span>
              <button class="num-btn plus" data-target="edit-warmup">+</button>
            </div>
          </div>
          <div class="editor-row">
            <label>Cycles</label>
            <div class="number-input">
              <button class="num-btn minus" data-target="edit-cycles">−</button>
              <input type="number" id="edit-cycles" value="1" min="1" max="50">
              <button class="num-btn plus" data-target="edit-cycles">+</button>
            </div>
          </div>
          <div class="editor-row">
            <label>Recovery Between Cycles</label>
            <div class="number-input">
              <button class="num-btn minus" data-target="edit-recovery">−</button>
              <input type="number" id="edit-recovery" value="60" min="0" max="600"> <span class="unit">s</span>
              <button class="num-btn plus" data-target="edit-recovery">+</button>
            </div>
          </div>
          <div class="editor-row">
            <label>Cooldown</label>
            <div class="number-input">
              <button class="num-btn minus" data-target="edit-cooldown">−</button>
              <input type="number" id="edit-cooldown" value="0" min="0" max="600"> <span class="unit">s</span>
              <button class="num-btn plus" data-target="edit-cooldown">+</button>
            </div>
          </div>
        </div>
        <div class="editor-section">
          <h3>Sets</h3>
          <div id="sets-list" class="sets-list"></div>
          <button id="btn-add-set" class="btn-secondary btn-full">+ Add Set</button>
        </div>
      </div>
    </div>

    <!-- ========== SET EDITOR MODAL ========== -->
    <div id="modal-set" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modal-set-title">Edit Set</h3>
          <button id="btn-modal-close" class="nav-btn" aria-label="Close">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="editor-row">
            <label>Exercise Name</label>
            <input type="text" id="set-name" class="editor-input" placeholder="e.g. Push-ups">
          </div>
          <div class="editor-row">
            <label>Exercise Duration</label>
            <div class="number-input">
              <button class="num-btn minus" data-target="set-exercise-dur">−</button>
              <input type="number" id="set-exercise-dur" value="20" min="1" max="600"> <span class="unit">s</span>
              <button class="num-btn plus" data-target="set-exercise-dur">+</button>
            </div>
          </div>
          <div class="editor-row">
            <label>Rest Duration</label>
            <div class="number-input">
              <button class="num-btn minus" data-target="set-rest-dur">−</button>
              <input type="number" id="set-rest-dur" value="10" min="0" max="600"> <span class="unit">s</span>
              <button class="num-btn plus" data-target="set-rest-dur">+</button>
            </div>
          </div>
          <div class="editor-row">
            <label>Color</label>
            <input type="color" id="set-color" value="#E86C3A" class="color-input">
          </div>
          <div class="editor-row">
            <label>Sound</label>
            <select id="set-sound">
              <option value="default">Use Global</option>
              <option value="short-beep">Short Beep</option>
              <option value="double-beep">Double Beep</option>
              <option value="whistle">Whistle</option>
              <option value="bell">Bell</option>
            </select>
          </div>
          <div class="editor-row editor-row-stack">
            <label>Exercise Image</label>
            <div class="image-upload-area">
              <img id="set-image-preview" class="set-image-preview hidden" alt="Preview">
              <button id="btn-set-image" class="btn-secondary">Choose Image</button>
              <button id="btn-set-image-clear" class="btn-danger btn-small hidden">Remove</button>
              <input type="file" id="set-image-input" accept="image/*" class="hidden">
            </div>
          </div>
          <div class="editor-row editor-row-stack">
            <label>Exercise Video (optional)</label>
            <div class="image-upload-area">
              <video id="set-video-preview" class="set-video-preview hidden" muted playsinline loop></video>
              <button id="btn-set-video" class="btn-secondary">Choose Video</button>
              <button id="btn-set-video-clear" class="btn-danger btn-small hidden">Remove</button>
              <input type="file" id="set-video-input" accept="video/*" class="hidden">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button id="btn-set-delete" class="btn-danger">Delete Set</button>
          <button id="btn-set-save" class="btn-primary">Save Set</button>
        </div>
      </div>
    </div>

  </div>
  <script src="app.js"></script>
</body>
</html>
